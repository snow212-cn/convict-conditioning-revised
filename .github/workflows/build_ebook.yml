name: 构建电子书并发布

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'revised_book_v2/**/*.md'
      - '.github/workflows/build_ebook.yml'
  workflow_dispatch:
    inputs:
      pdf_engine:
        description: 'PDF生成引擎'
        required: true
        default: 'calibre'
        type: choice
        options:
          - calibre
          - pandoc
      pandoc_args:
        description: 'Pandoc自定义参数 (例如: --toc-depth=2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # 说明：GitHub hosted runner 每次都是“干净机器”，apt 安装会很耗时。
      # 使用 cache-apt-pkgs-action 后，后续运行会加速（第一次仍需要完整安装）。
      - name: 缓存并安装基础依赖（Pandoc + 中文字体）
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: pandoc fonts-noto-cjk fonts-noto-cjk-extra
          version: 1.0

      - name: 检查Pandoc版本
        run: |
          pandoc --version

      - name: 刷新字体缓存
        run: |
          fc-cache -fv
          echo "✅ 中文字体缓存刷新完成"
          fc-list :lang=zh | head -5

      - name: 缓存并安装Calibre
        if: github.event.inputs.pdf_engine != 'pandoc'
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: calibre
          version: 1.0

      - name: 检查Calibre版本
        if: github.event.inputs.pdf_engine != 'pandoc'
        run: |
          ebook-convert --version

      - name: 缓存并安装XeLaTeX (用于Pandoc PDF)
        if: github.event.inputs.pdf_engine == 'pandoc'
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: texlive-xetex texlive-fonts-recommended texlive-plain-generic texlive-lang-chinese
          version: 1.0
      
      - name: 合并章节文件
        run: |
          python scripts/merge_chapters.py
          echo "✅ 章节合并完成"
          ls -lh Convict_Conditioning_Revised_Complete.md
      
      - name: 生成电子书
        run: |
          python scripts/build_ebook.py --pdf-engine=${{ github.event.inputs.pdf_engine || 'calibre' }} --pandoc-args="${{ github.event.inputs.pandoc_args }}"
          echo "✅ 电子书生成完成"
          ls -lh Convict_Conditioning_Revised_Complete.*
      
      - name: 获取当前日期和时间
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
          echo "version=v$(date +'%Y.%m.%d')_${{ github.run_number }}" >> $GITHUB_OUTPUT
      
      - name: 跳过提交到仓库（产物不会推送到代码仓库）
        run: |
          echo "📦 电子书产物将作为 Release 附件上传，不会 commit/push 到仓库"
      
      - name: 创建Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.date.outputs.version }}
          release_name: 囚徒健身修订版 ${{ steps.date.outputs.version }}
          body: |
            ## 📚 囚徒健身 - 科学修订版
            
            **发布版本**: ${{ steps.date.outputs.version }}
            **发布日期**: ${{ steps.date.outputs.date }}
            
            ### 📥 下载
            
            - **EPUB格式**: 适用于大多数电子书阅读器
            - **PDF格式**: 适用于打印和电脑阅读
            - **Markdown格式**: 适用于在线阅读和编辑
            
            ### 📝 更新说明
            
            本版本基于最新的章节修订自动构建生成。
            
            ### ⚠️ 免责声明
            
            本修订版本仅供学习交流使用，不得用于商业用途。
            训练前请咨询专业医疗人员或认证教练。
            
            ---
            
            **构建时间**: ${{ steps.date.outputs.datetime }}
            **构建编号**: ${{ github.run_number }}
          draft: false
          prerelease: false
      
      - name: 上传EPUB到Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./Convict_Conditioning_Revised_Complete.epub
          asset_name: Convict_Conditioning_Revised_${{ steps.date.outputs.version }}.epub
          asset_content_type: application/epub+zip
      
      - name: 上传PDF到Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./Convict_Conditioning_Revised_Complete.pdf
          asset_name: Convict_Conditioning_Revised_${{ steps.date.outputs.version }}.pdf
          asset_content_type: application/pdf
        continue-on-error: true
      
      - name: 上传Markdown到Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./Convict_Conditioning_Revised_Complete.md
          asset_name: Convict_Conditioning_Revised_${{ steps.date.outputs.version }}.md
          asset_content_type: text/markdown
      
      - name: 构建完成通知
        run: |
          echo "================================================"
          echo "✅ 电子书构建和发布完成！"
          echo "================================================"
          echo "📦 Release版本: ${{ steps.date.outputs.version }}"
          echo "🔗 Release链接: ${{ steps.create_release.outputs.html_url }}"
          echo "================================================"
